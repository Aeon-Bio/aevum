[project]
name = "aevum"
version = "0.1.0"
description = "OT-2 raised plate-mode incubator and inverted photonics engineering workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "pillow>=10,<13",
  "pydantic>=2.8",
  "typer>=0.12",
  "zeroconf>=0.132,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[project.scripts]
aevum-ot2 = "aevum_ot2.adapters.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aevum_cad", "src/aevum_ot2", "src/aevum_smis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
