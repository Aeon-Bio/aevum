[project]
name = "aevum"
version = "0.1.0"
description = "OT-2 raised plate-mode incubator and inverted photonics engineering workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "ot2-harness @ git+https://github.com/Aeon-Bio/ot2-harness.git@f53ea3fbd67558fa9765ec1b96a1df26b490bf61",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/aevum_cad",
  "src/aevum_ot2_profile",
  "src/aevum_smis",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
