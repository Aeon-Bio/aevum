[project]
name = "aevum"
version = "0.1.0"
description = "OT-2 raised plate-mode incubator and inverted photonics engineering workspace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-CODE"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "ot2-harness @ git+https://github.com/Aeon-Bio/ot2-harness.git@663cf647d2bae516f955e2daf51ae2b3ae8abb0f",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]
bambu = [
    "paho-mqtt>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/aevum_cad",
  "src/aevum_ot2_profile",
  "src/aevum_smis",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
